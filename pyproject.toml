[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-snippets-collection"
version = "1.0.0"
description = "Colección curada de snippets SQL (MySQL, PostgreSQL, Laravel) con validador CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Edward Itriago", email = "edwarditriagosub@gmail.com" }]
requires-python = ">=3.9"
keywords = ["sql", "mysql", "postgresql", "laravel", "snippets", "reference"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
devsql = "devsql.cli:main"

[project.urls]
Homepage = "https://github.com/Edward-Edo/sql-snippets-collection"
Issues = "https://github.com/Edward-Edo/sql-snippets-collection/issues"

[tool.hatch.build.targets.wheel]
packages = ["tools/devsql"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
